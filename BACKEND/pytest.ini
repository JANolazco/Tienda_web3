[pytest]
DJANGO_SETTINGS_MODULE = inventario_api.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = --cov=inventario --cov-report=html --cov-report=term-missing --strict-markers
testpaths = inventario Ticket
markers =
    unit: unit tests
    integration: integration tests
    slow: slow tests
